<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="zbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1F1F2E"/>
      <stop offset="1" stop-color="#0E0E16"/>
    </linearGradient>
    <linearGradient id="zg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#3ECFCF"/>
    </linearGradient>
  </defs>
  <!-- 印章式圆角方容器（现代印章 = 圣贤之印） -->
  <rect width="128" height="128" rx="28" fill="url(#zbg)"/>
  <g transform="translate(64 64) scale(0.7) translate(-64 -64)">
    <g stroke="url(#zg2)" stroke-width="20" stroke-linecap="round">
      <line x1="38" y1="38" x2="57" y2="57"/>
      <line x1="90" y1="38" x2="71" y2="57"/>
      <line x1="38" y1="90" x2="57" y2="71"/>
      <line x1="90" y1="90" x2="71" y2="71"/>
    </g>
    <circle cx="64" cy="64" r="14" fill="url(#zg2)"/>
    <circle cx="64" cy="64" r="5.5" fill="#FFFFFF"/>
  </g>
</svg>
