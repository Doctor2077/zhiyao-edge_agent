<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <title>执要 Agent 具象方案</title>
    <style>
      body {
        margin: 0;
        font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
        background: #1a1a1a;
        color: #fff;
        padding: 36px;
      }
      h1 { font-size: 22px; margin: 0 0 4px; }
      .sub { color: #9a9a9a; font-size: 13px; margin-bottom: 30px; }
      .grid { display: flex; gap: 20px; flex-wrap: wrap; }
      .concept {
        background: #242424;
        border: 1px solid #3a3a3a;
        border-radius: 14px;
        padding: 18px;
        width: 300px;
      }
      .concept h2 { margin: 0; font-size: 15px; }
      .concept .story { color: #cfcfcf; font-size: 12.5px; margin: 4px 0 2px; }
      .concept .desc { color: #9a9a9a; font-size: 12px; margin-bottom: 12px; min-height: 30px; }
      .row { display: flex; align-items: center; gap: 12px; }
      .tile-w { background: #fff; border-radius: 18%; padding: 5px; width: 92px; height: 92px; display: grid; place-items: center; }
      .tile-b { background: #111; border-radius: 18%; padding: 5px; width: 92px; height: 92px; display: grid; place-items: center; }
      .small-row { display: flex; gap: 8px; align-items: center; margin-top: 12px; }
      .small-row img { background: #fff; border-radius: 18%; }
      .rec { display: inline-block; background: #fff; color: #000; font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; margin-left: 8px; }
    </style>
  </head>
  <body>
    <h1>执要 Agent · 具象方案</h1>
    <div class="sub">这次每个都能「看出是什么」：羽扇 / 手势 / 折扇 / 汉字，全部纯黑白</div>
    <div class="grid">
      <div class="concept">
        <h2>V5 · 羽扇执要<span class="rec">推荐</span></h2>
        <div class="story">诸葛亮羽扇——运筹帷幄的圣人</div>
        <div class="desc">扇轴白点即「要」：执扇于轴，扇动风生，四方来效。一眼认出是羽扇</div>
        <div class="row">
          <div class="tile-w"><img src="./logo-V5.svg" width="80" height="80" /></div>
          <div class="tile-b"><img src="./logo-V5.svg" width="80" height="80" style="filter: invert(1)" /></div>
        </div>
        <div class="small-row">
          <img src="./logo-V5.svg" width="16" height="16" />
          <img src="./logo-V5.svg" width="32" height="32" />
          <img src="./logo-V5.svg" width="48" height="48" />
        </div>
      </div>
      <div class="concept">
        <h2>V6 · 执要于握</h2>
        <div class="story">「执」字本义：手握着东西</div>
        <div class="desc">拇指食指环住一点（要），三指舒展（四方来效）——尽在掌握。一眼认出是手势</div>
        <div class="row">
          <div class="tile-w"><img src="./logo-V6.svg" width="80" height="80" /></div>
          <div class="tile-b"><img src="./logo-V6.svg" width="80" height="80" style="filter: invert(1)" /></div>
        </div>
        <div class="small-row">
          <img src="./logo-V6.svg" width="16" height="16" />
          <img src="./logo-V6.svg" width="32" height="32" />
          <img src="./logo-V6.svg" width="48" height="48" />
        </div>
      </div>
      <div class="concept">
        <h2>V7 · 折扇开四方</h2>
        <div class="story">一个枢轴，扇骨向四方展开</div>
        <div class="desc">几何即成语：枢轴一点=执要，扇骨放射=四方来效。一眼认出是折扇</div>
        <div class="row">
          <div class="tile-w"><img src="./logo-V7.svg" width="80" height="80" /></div>
          <div class="tile-b"><img src="./logo-V7.svg" width="80" height="80" style="filter: invert(1)" /></div>
        </div>
        <div class="small-row">
          <img src="./logo-V7.svg" width="16" height="16" />
          <img src="./logo-V7.svg" width="32" height="32" />
          <img src="./logo-V7.svg" width="48" height="48" />
        </div>
      </div>
      <div class="concept">
        <h2>V8 · 大人执一</h2>
        <div class="story">「大」= 人张开双臂握住「一」</div>
        <div class="desc">大人即圣人，执一即执要。一眼认出是「大」，小尺寸最清晰</div>
        <div class="row">
          <div class="tile-w"><img src="./logo-V8.svg" width="80" height="80" /></div>
          <div class="tile-b"><img src="./logo-V8.svg" width="80" height="80" style="filter: invert(1)" /></div>
        </div>
        <div class="small-row">
          <img src="./logo-V8.svg" width="16" height="16" />
          <img src="./logo-V8.svg" width="32" height="32" />
          <img src="./logo-V8.svg" width="48" height="48" />
        </div>
      </div>
    </div>
  </body>
</html>
