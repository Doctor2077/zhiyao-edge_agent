<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- 方案 D：合符 —— 虎符一剖为二，合符则四方来效（圣人执要之信物） -->
  <defs>
    <clipPath id="sealD">
      <rect x="14" y="14" width="100" height="100" rx="16"/>
    </clipPath>
  </defs>
  <g clip-path="url(#sealD)">
    <!-- 左半：白（留纸） -->
    <rect x="14" y="14" width="100" height="100" fill="#FFFFFF"/>
    <!-- 右半：黑 -->
    <path d="M 64 6 L 54 38 L 74 54 L 54 70 L 74 86 L 64 122 L 128 122 L 128 6 Z" fill="#000000"/>
  </g>
  <!-- 外框与合符折线 -->
  <rect x="14" y="14" width="100" height="100" rx="16" fill="none" stroke="#000000" stroke-width="8"/>
  <path d="M 64 6 L 54 38 L 74 54 L 54 70 L 74 86 L 64 122" fill="none" stroke="#000000" stroke-width="8"/>
</svg>
