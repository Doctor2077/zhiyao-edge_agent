<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 96">
  <defs>
    <linearGradient id="zw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C63FF"/>
      <stop offset="1" stop-color="#3ECFCF"/>
    </linearGradient>
  </defs>
  <!-- mark（缩小版，透明底） -->
  <g transform="translate(28 48) scale(0.42) translate(-64 -64)">
    <g stroke="url(#zw)" stroke-width="20" stroke-linecap="round">
      <line x1="38" y1="38" x2="57" y2="57"/>
      <line x1="90" y1="38" x2="71" y2="57"/>
      <line x1="38" y1="90" x2="57" y2="71"/>
      <line x1="90" y1="90" x2="71" y2="71"/>
    </g>
    <circle cx="64" cy="64" r="14" fill="url(#zw)"/>
    <circle cx="64" cy="64" r="5.5" fill="#FFFFFF"/>
  </g>
  <!-- 字标：东方衬线（执要）+ 现代无衬线（AGENT） -->
  <text x="76" y="50" font-family="'Noto Serif SC','STSong','SimSun',serif" font-size="38" font-weight="700" fill="#1C1930">执要</text>
  <text x="160" y="50" font-family="'Segoe UI',system-ui,sans-serif" font-size="20" font-weight="600" letter-spacing="3" fill="url(#zw)">AGENT</text>
  <text x="78" y="76" font-family="system-ui,'Microsoft YaHei',sans-serif" font-size="13" fill="#8A86A8" letter-spacing="1">圣人执要 · 四方来效</text>
</svg>
